name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

# Action pin maintenance: Dependabot checks these immutable commit pins monthly
# (see .github/dependabot.yml). Review each PR for upstream security and
# compatibility notes, then update only the commit SHA and matching version
# comment; do not replace the SHA with a mutable tag or ref.
jobs:
  validate-workflow:
    name: Validate release workflow configuration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      # v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Check workflow syntax and configuration
      # v2.2.0
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
      with:
        files: .github/workflows/build-windows.yml

  validate-corpus:
    needs: validate-workflow
    runs-on: windows-latest

    steps:
    - name: Checkout
      # v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Python
      # v5.6.0
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        }

    - name: Preview reviewed corpus baseline
      shell: pwsh
      run: |
        $previewPath = "reports/corpus_baseline_preview.json"
        python corpus_runner.py `
          --root . `
          --output reports/corpus_differential_latest.json
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Release approval blocked: current corpus report could not be generated."
          exit $LASTEXITCODE
        }

        python corpus_runner.py `
          --root . `
          --preview-baseline reports/corpus_baseline.json `
          --source-report reports/corpus_differential_latest.json `
          --json > $previewPath
        $previewStatus = $LASTEXITCODE

        if (-not (Test-Path $previewPath)) {
          Write-Error "Release approval blocked: baseline preview did not produce $previewPath."
          exit 1
        }

        try {
          $preview = Get-Content -Raw $previewPath | ConvertFrom-Json
        } catch {
          Write-Error "Release approval blocked: baseline preview JSON could not be parsed."
          exit 1
        }

        if ($preview.reviewed_report_matches_current -ne $true) {
          Write-Error "Release approval blocked: reviewed_report_matches_current is false; the reviewed baseline report does not match the current corpus."
          exit 1
        }

        if ($previewStatus -ne 0) {
          Write-Error "Release approval blocked: baseline preview exited with status $previewStatus."
          exit $previewStatus
        }

    - name: Upload baseline preview
      if: always()
      # v4.6.2
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: NAVAREA-baseline-preview
        path: reports/corpus_baseline_preview.json
        if-no-files-found: error

    - name: Validate NAVAREA corpus
      run: >-
        python corpus_runner.py
        --root .
        --baseline reports/corpus_baseline.json
        --fail-on-loss
        --output reports/corpus_validation.json
        --github-summary "$env:GITHUB_STEP_SUMMARY"

    - name: Upload corpus validation report
      if: always()
      # v4.6.2
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: NAVAREA-corpus-validation
        path: reports/corpus_validation.json
        if-no-files-found: error

  validate-windows-preview:
    name: Smoke test Windows release approval
    needs: validate-workflow
    runs-on: windows-latest

    steps:
    - name: Checkout
      # v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Python
      # v5.6.0
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'

    - name: Smoke test captured baseline approval path
      shell: pwsh
      run: |
        $previewPath = Join-Path $env:RUNNER_TEMP "corpus_baseline_preview.json"
        $sourceReportPath = Join-Path $env:RUNNER_TEMP "reviewed-full-report.json"

        python corpus_runner.py `
          --root . `
          --output $sourceReportPath

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Windows smoke test failed: current corpus report could not be generated."
          exit $LASTEXITCODE
        }

        function Assert-BaselinePreviewApproval {
          param(
            [string]$ExpectedSourceReport,
            [bool]$ExpectedApproval
          )

          Remove-Item $previewPath -Force -ErrorAction SilentlyContinue

          $previewOutput = python corpus_runner.py `
            --root . `
            --preview-baseline reports/corpus_baseline.json `
            --source-report $ExpectedSourceReport `
            --json

          $previewStatus = $LASTEXITCODE
          $previewOutput |
            Set-Content -Path $previewPath -Encoding utf8NoBOM

          if (-not (Test-Path $previewPath)) {
            Write-Error "Windows smoke test failed: baseline preview did not produce $previewPath."
            exit 1
          }

          try {
            $preview = Get-Content -Raw $previewPath | ConvertFrom-Json
          } catch {
            Write-Error "Windows smoke test failed: baseline preview JSON could not be parsed."
            exit 1
          }

          Write-Host "Windows smoke preview exit code: $previewStatus"
          Write-Host "Windows smoke reviewed fingerprint: $($preview.reviewed_report_sha256)"
          Write-Host "Windows smoke current fingerprint: $($preview.current_report_sha256)"
          Write-Host "Windows smoke reviewed/current match: $($preview.reviewed_report_matches_current)"

          $approval = (
            $preview.reviewed_report_matches_current -eq $true -and
            $previewStatus -eq 0
          )

          if ($approval -ne $ExpectedApproval) {
            Write-Error "Windows smoke test failed: expected approval $ExpectedApproval, got $approval."
            exit 1
          }

          if ($ExpectedApproval -and $preview.reviewed_report_matches_current -ne $true) {
            Write-Error "Windows smoke test failed: matching reviewed report was not approved."
            exit 1
          }

          if (-not $ExpectedApproval -and $preview.reviewed_report_matches_current -ne $false) {
            Write-Error "Windows smoke test failed: stale reviewed report was not observable as stale."
            exit 1
          }
        }

        Assert-BaselinePreviewApproval $sourceReportPath $true

        $staleReport = Get-Content -Raw $sourceReportPath | ConvertFrom-Json
        $staleReport.messages[0].id = "NAVAREA WINDOWS SMOKE 99/2026"

        $staleReport |
          ConvertTo-Json -Depth 100 |
          Set-Content -Path $sourceReportPath -Encoding utf8NoBOM

        Assert-BaselinePreviewApproval $sourceReportPath $false

        # The expected stale preview exits with status 1. Both assertions have
        # passed, so normalize the PowerShell step result explicitly.
        exit 0

  validate-posix-wrapper:
    needs: validate-workflow
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      # v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Python
      # v5.6.0
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Smoke test release validation wrapper
      run: >-
        python -m unittest
        tests.test_corpus_runner.CorpusRunnerTests.test_release_validation_wrapper_launches_from_clean_checkout
        -v

  build:
    needs:
      - validate-workflow
      - validate-corpus
      - validate-windows-preview
      - validate-posix-wrapper
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest

    steps:
    - name: Checkout
      # v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Python
      # v5.6.0
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        }

    - name: Run Python checks
      run: python -m unittest discover -s tests -v

    - name: Build EXE
      run: pyinstaller --onefile --console --icon=icon.ico --version-file=version_info.txt --name NAVAREA2UC main.py

    - name: Upload Artifact
      # v4.6.2
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: NAVAREA2UC-v1.3.0
        path: dist/NAVAREA2UC.exe