<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NAVAREA2UC</title>

    <link rel="icon" href="icon.ico">

    <style>
        body {
            margin: 0;
            background: #071321;
            color: #ffffff;
            font-family: Segoe UI, Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px 80px;
        }

        .logo {
            width: 360px;
            max-width: 90%;
            border-radius: 18px;
        }

        h1 {
            margin: 30px 0 10px;
            font-size: 58px;
            letter-spacing: 1px;
        }

        .tagline {
            color: #cbd5e1;
            font-size: 22px;
            margin-bottom: 60px;
        }

        .version-label {
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .version {
            margin-top: 10px;
            font-size: 48px;
            font-weight: 700;
        }

        .buttons {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: .2s;
        }

        .btn-download {
            background: #2563eb;
            color: white;
        }

        .btn-download:hover {
            background: #1d4ed8;
        }

        .btn-github {
            background: #1f2937;
            color: white;
        }

        .btn-github:hover {
            background: #374151;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: #334155;
            margin: 80px auto;
        }

        .coming {
            font-size: 34px;
            font-weight: 700;
        }

        .next {
            font-size: 28px;
            color: #60a5fa;
            margin-top: 10px;
            margin-bottom: 40px;
        }

        .features {
            line-height: 2;
            font-size: 20px;
            color: #e2e8f0;
        }

        .vision {
            margin-top: 60px;
            font-size: 26px;
            line-height: 1.8;
            font-weight: 600;
        }

        .footer {
            margin-top: 80px;
            color: #64748b;
            font-size: 14px;
        }

        @media(max-width:768px) {

            h1 {
                font-size: 42px;
            }

            .tagline {
                font-size: 18px;
            }

            .version {
                font-size: 36px;
            }

            .features {
                font-size: 18px;
            }

            .vision {
                font-size: 20px;
            }

            .btn {
                display: block;
                max-width: 280px;
                margin: 12px auto;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <a href="https://github.com/drlivsi2004/NAVAREA2UC" target="_blank" rel="noopener noreferrer">
            <img src="logo.png" alt="NAVAREA2UC" class="logo">
        </a>

        <h1>NAVAREA2UC</h1>

        <div class="tagline">
            From Maritime Notices to User Charts
        </div>

        <div class="version-label">
            Current Stable Release
        </div>

        <div class="version">
            v1.2.1
        </div>

        <div class="buttons">

            <a href="https://github.com/drlivsi2004/NAVAREA2UC/releases/tag/v1.2.1" target="_blank" rel="noopener noreferrer" class="btn btn-download">
                Download
            </a>

            <a href="https://github.com/drlivsi2004/NAVAREA2UC" target="_blank" rel="noopener noreferrer" class="btn btn-github">
                GitHub
            </a>

        </div>

        <div class="divider"></div>

        <div class="coming">
            COMING SOON
        </div>

        <div class="next">
            v1.3.0
        </div>

        <div class="features">

            Document Classification Layer<br>
            T&amp;P Pipeline<br>
            AIO Support<br>
            Pre-Arrival Information

        </div>

        <div class="vision">

            Any Source.<br>
            Any Format.<br>
            Any ECDIS.

        </div>

        <div class="footer">

            NAVAREA2UC &copy; 2026

        </div>

    </div>

</body>

</html>
